# Base Messages
validation.result.success               =The {0} "{1}" is valid: {2}
validation.result.skipped               =Validation for {0} "{1}" was skipped
validation.result.failure               =The {0} "{1}" is invalid: {2}
validation.result.collection            =Aggregated validation result for {0}
validation.result.aggregated.field      = - {0} "{1}": {2}
validation.result.aggregated.success    =Validation for {0} succeeded:
validation.result.aggregated.skipped    =Validation for {0} was skipped entirely.
validation.result.aggregated.failure    =Validation for {0} failed with {1} error(s):

# Collection Validation Messages
validation.collection.empty             =Collection must not be empty
validation.collection.sizeBetween       =Size must be greater than {0} and less than {1}
validation.collection.contains          =Collection must contain Object "{0}"
validation.collection.hasNullElements   =Collection must contain at least one null element
validation.collection.noNullElements    =Collection must not contain null elements
validation.collection.allMatch          =All elements must match the Predicate
validation.collection.anyMatch          =At least one element must match the Predicate
validation.collection.noneMatch         =No element should match the predicate

#Integer Validation Messages
validation.integer.sameAmount           =must equal {0}
validation.integer.lowerThan            =must be lower than {0}
validation.integer.greaterThan          =must be greater than {0}
validation.integer.isEven               =must be even
validation.integer.isOdd                =must be odd

#Object Validation Messages
validation.object.notNull               =must not be null
validation.object.equalTo               =must be equal to "{0}"

#String Validation Messages
validation.string.notEmpty              =must not be empty
validation.string.notBlank              =must not be blank
validation.string.exactly               =must have exactly {0} chars
validation.string.moreThan              =must have more than {0} chars
validation.string.lessThan              =must have less than {0} chars
validation.string.contains              =must contain "{0}"
validation.string.matchRegex            =must fully match regex " {0} "
validation.string.containRegex          =must contain substring matching regex " {0} "
validation.string.startsWith            =must start with "{0}"
validation.string.endsWith              =must end with "{0}"