# Nachrichten zur Collection-Validierung
validation.collection.empty             =Sammlung darf nicht leer sein
validation.collection.sizeBetween       =Größe muss größer als {0} und kleiner als {1} sein
validation.collection.contains          =Sammlung muss das Objekt "{0}" enthalten
validation.collection.hasNullElements   =Sammlung muss mindestens ein null-Element enthalten
validation.collection.noNullElements    =Sammlung darf keine null-Elemente enthalten
validation.collection.allMatch          =Alle Elemente müssen der Bedingung entsprechen
validation.collection.anyMatch          =Mindestens ein Element muss der Bedingung entsprechen
