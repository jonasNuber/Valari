# String-Validierungsnachrichten
validation.string.notEmpty              =darf nicht leer sein
validation.string.notBlank              =darf nicht nur aus Leerzeichen bestehen
validation.string.exactly               =muss genau {0} Zeichen haben
validation.string.moreThan              =muss mehr als {0} Zeichen haben
validation.string.lessThan              =muss weniger als {0} Zeichen haben
validation.string.contains              =muss "{0}" enthalten
validation.string.matchRegex            =muss vollständig dem regulären Ausdruck "{0}" entsprechen
validation.string.containRegex          =muss eine Teilzeichenfolge enthalten, die dem regulären Ausdruck "{0}" entspricht
validation.string.startsWith            =muss mit "{0}" beginnen
validation.string.endsWith              =muss mit "{0}" enden

